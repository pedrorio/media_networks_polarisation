name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install kustomize
        run: |
          curl -fsSL -o /tmp/kustomize.tgz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          sudo tar -C /usr/local/bin -xzf /tmp/kustomize.tgz

      - name: Install Python tools
        run: python -m pip install pytest ruff pyyaml

      - name: Install loader dependencies
        working-directory: loader
        run: npm ci

      - name: Lint tests
        run: ruff check tests

      - name: Run tests
        run: pytest -q

      - name: Validate OpenSpec
        env:
          OPENSPEC_TELEMETRY: "0"
        run: |
          npm install --prefix "$HOME/.local" @fission-ai/openspec@1.15.0
          "$HOME/.local/node_modules/.bin/openspec" validate --all --strict --no-interactive
