apiVersion: skaffold/v2beta5
kind: Config
metadata:
  name: news
profiles:

  - name: development
    build:
      artifacts:
        - image: news/manager
          context: .
          docker:
            dockerfile: microservices/manager/Dockerfile
            cacheFrom:
              - node:14.5-alpine
            noCache: true
          sync:
            manual:
              - src: '**/*.js'
                dest: .
              - src: '**/*.ts'
                dest: .

        - image: news/worker
          context: .
          docker:
            dockerfile: microservices/worker/Dockerfile
            cacheFrom:
              - node:14.5-alpine
            noCache: true
          sync:
            manual:
              - src: '**/*.js'
                dest: .
              - src: '**/*.ts'
                dest: .

    deploy:
      kustomize:
        paths:
          - microservices/k8s/base
