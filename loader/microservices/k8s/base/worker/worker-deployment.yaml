apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      component: worker
  template:
    metadata:
      labels:
        component: worker
    spec:
      containers:
        - name: worker
          image: news/worker
          env:
            - name: KAFKA_HOST
              value: kafka-cluster-ip-service
            - name: KAFKA_PORT
              value: '9092'
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/consumer-ready"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "test -f /tmp/consumer-live && find /tmp/consumer-live -mmin -1 | grep -q ."]
            initialDelaySeconds: 15
            periodSeconds: 10

