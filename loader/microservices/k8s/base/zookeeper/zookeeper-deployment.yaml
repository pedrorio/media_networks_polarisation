apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      component: zookeeper
  template:
    metadata:
      labels:
        component: zookeeper
    spec:
      volumes:
        - name: zookeeper-storage
          persistentVolumeClaim:
            claimName: registry-persistent-volume-claim
      containers:
        - name: zookeeper
          image: bitnami/zookeeper:3.6.1
          ports:
            - containerPort: 2181
          readinessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: zookeeper-storage
              mountPath: /bitnami/zookeeper
              subPath: data/zookeeper
          env:
            - name:  ALLOW_ANONYMOUS_LOGIN
              value: 'yes'
